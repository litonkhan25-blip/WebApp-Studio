<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Project Manager - WebApp Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-[#0b0f19] text-gray-200 font-sans">
    <div class="flex h-screen overflow-hidden">
