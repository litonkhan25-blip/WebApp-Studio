<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Settings - WebApp Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-gray-200 font-sans">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-[#0e1626] border-r border-gray-800 hidden md:flex flex-col">
            <nav class="px-4 py-4 space-y-1">
                <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>
        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold text-white mb-4"><i class="fa-solid fa-gear text-gray-400"></i> Settings</h1>
            <p class="text-gray-400 mb-6">Update your account preferences, API keys, and configurations.</p>
            <div class="bg-[#111827] border border-gray-800 p-6 rounded-xl max-w-xl space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Display Name</label>
                    <input type="text" value="Your Name" class="w-full bg-[#131d31] border border-gray-700 rounded-xl px-4 py-2 text-white">
                </div>
                <button class="px-6 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold">Save Changes</button>
            </div>
        </main>
    </div>
</body>
</html>
