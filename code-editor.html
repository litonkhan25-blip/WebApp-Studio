 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Code Studio - WebApp Studio</title>
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-gray-200 font-sans antialiased selection:bg-blue-600 selection:text-white">

    <!-- UNIVERSAL EDITOR LAYOUT -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[#0e1626] border-r border-gray-800 flex flex-col justify-between hidden md:flex">
            <div>
                <!-- Logo -->
                <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-800">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-2 rounded-lg text-white font-bold text-lg">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <span class="text-xl font-bold tracking-wide text-white">WebApp <span class="text-indigo-400">Studio</span></span>
                </div>

                <!-- Navigation Links -->
                <nav class="px-4 py-4 space-y-1">
                    <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                    <a href="website-builder.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-globe"></i> AI Website Builder
                    </a>
                    <a href="app-builder.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-mobile-screen"></i> AI App Builder
                    </a>
                    <a href="game-builder.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-gamepad"></i> AI Game Builder
                    </a>
                    <a href="code-editor.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium transition shadow-lg shadow-blue-600/20">
                        <i class="fa-solid fa-code"></i> Universal Editor
                    </a>
                    <a href="preview.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-eye"></i> Preview & Testing
                    </a>
                    <a href="projects.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-folder"></i> Project Manager
                    </a>
                    <a href="database.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-database"></i> Database Manager
                    </a>
                    <a href="publish.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Publish & Export
                    </a>
                    <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800/50 hover:text-white transition">
                        <i class="fa-solid fa-gear"></i> Settings & Privacy
                    </a>
                </nav>
            </div>

            <!-- Profile & Logout Box -->
            <div class="p-4 m-4 bg-[#131d31] rounded-2xl border border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 flex items-center font-bold justify-center text-xs">
                        <i class="fa-solid fa-shield"></i>
                    </div>
                    <div class="truncate">
                        <p class="text-xs font-semibold text-white truncate" id="sidebar-user-email">Active User</p>
                        <p class="text-[10px] text-blue-400">Secure Session</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 p-2 text-sm transition" title="Log Out">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            
            <!-- Top Navbar with Language Selector -->
            <header class="h-16 bg-[#0e1626]/80 backdrop-blur border-b border-gray-800 px-6 flex items-center justify-between z-10 shrink-0">
                <div class="flex items-center gap-4">
                    <span class="text-xs text-gray-400">Select Language:</span>
                    <select id="lang-selector" onchange="changeLanguageTemplate()" class="bg-[#131d31] border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                        <option value="html">HTML / CSS / Web</option>
                        <option value="js">JavaScript (Node/Browser)</option>
                        <option value="python">Python Simulation</option>
                        <option value="cpp">C++ / C Simulation</option>
                    </select>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="executeCode()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-play"></i> Run & Execute
                    </button>
                    <button onclick="handleLogout()" class="px-4 py-2 bg-red-600/20 border border-red-500/30 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Log Out
                    </button>
                </div>
            </header>

            <!-- Split Workspace: Code Editor & Output Console -->
            <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 overflow-hidden">
                
                <!-- Left: Code Input Area -->
                <div class="bg-[#090d16] border-r border-gray-800 flex flex-col h-full">
                    <div class="px-4 py-3 bg-[#0e1626] border-b border-gray-800 flex items-center justify-between">
                        <span id="editor-file-title" class="text-xs font-bold text-gray-300 flex items-center gap-2">
                            <i class="fa-solid fa-file-code text-blue-400"></i> workspace.html
                        </span>
                        <span class="text-[10px] text-gray-500">Full Customization Enabled</span>
                    </div>
                    <textarea id="universal-code-input" class="flex-1 bg-transparent text-emerald-400 font-mono text-xs p-4 focus:outline-none resize-none leading-relaxed" spellcheck="false">&lt;div style="text-align:center; padding: 50px; font-family: sans-serif; color: white;"&gt;
    &lt;h1 style="color: #38bdf8;"&gt;WebApp Studio Sandbox&lt;/h1&gt;
    &lt;p&gt;Edit this code freely and click 'Run & Execute'.&lt;/p&gt;
&lt;/div&gt;</textarea>
                </div>

                <!-- Right: Output Preview / Console -->
                <div class="bg-[#0b0f19] flex flex-col h-full">
                    <div class="px-4 py-3 bg-[#0e1626] border-b border-gray-800 flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-300 flex items-center gap-2">
                            <i class="fa-solid fa-terminal text-purple-400"></i> Execution Output / Preview
                        </span>
                        <button onclick="clearConsole()" class="text-[10px] text-gray-400 hover:text-white bg-gray-800 px-2.5 py-1 rounded-lg">Clear Output</button>
                    </div>
                    <div class="flex-1 p-4 overflow-auto flex flex-col">
                        <!-- HTML/Web Preview Iframe -->
                        <iframe id="output-iframe" class="w-full h-full bg-white rounded-2xl border border-gray-800"></iframe>
                        <!-- Text Console for JS/Python/C++ Output -->
                        <pre id="output-console" class="w-full h-full bg-[#05070c] text-emerald-400 font-mono text-xs p-4 rounded-2xl border border-gray-800 overflow-auto hidden"></pre>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- SCRIPT -->
    <script>
        window.onload = function() {
            const token = localStorage.getItem("webapp_auth_token");
            if (!token) {
                window.location.href = "index.html";
            } else {
                const email = localStorage.getItem("webapp_user_email");
                if(email) {
                    document.getElementById('sidebar-user-email').innerText = email;
                }
            }
            executeCode();
        }

        function changeLanguageTemplate() {
            const lang = document.getElementById('lang-selector').value;
            const textarea = document.getElementById('universal-code-input');
            const fileTitle = document.getElementById('editor-file-title');

            if (lang === 'html') {
                fileTitle.innerHTML = `<i class="fa-solid fa-file-code text-blue-400"></i> index.html`;
                textarea.value = `<div style="text-align:center; padding: 50px; font-family: sans-serif; color: white;">\n    <h1 style="color: #38bdf8;">HTML & Web Project</h1>\n    <p>Build stunning web interfaces here.</p>\n</div>`;
            } else if (lang === 'js') {
                fileTitle.innerHTML = `<i class="fa-solid fa-file-js text-yellow-400"></i> script.js`;
                textarea.value = `// JavaScript Execution Environment\nconst message = "Hello from WebApp Studio JavaScript Engine!";\nconsole.log(message);\n\nlet sum = 10 + 20;\nconsole.log("Calculated Sum: " + sum);`;
            } else if (lang === 'python') {
                fileTitle.innerHTML = `<i class="fa-solid fa-file-lines text-blue-500"></i> main.py`;
                textarea.value = `# Python Simulation Environment\nprint("Hello from Python Workspace!")\n\nfor i in range(1, 4):\n    print(f"Processing item {i}...")`;
            } else if (lang === 'cpp') {
                fileTitle.innerHTML = `<i class="fa-solid fa-file-code text-indigo-400"></i> program.cpp`;
                textarea.value = `// C++ Simulation Environment\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from C++ Universal Compiler!" << endl;\n    return 0;\n}`;
            }
            executeCode();
        }

        function executeCode() {
            const lang = document.getElementById('lang-selector').value;
            const code = document.getElementById('universal-code-input').value;
            const iframe = document.getElementById('output-iframe');
            const consoleBox = document.getElementById('output-console');

            if (lang === 'html') {
                iframe.classList.remove('hidden');
                consoleBox.classList.add('hidden');
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            } else {
                iframe.classList.add('hidden');
                consoleBox.classList.remove('hidden');
                
                // Simulate execution output for JS, Python, C++
                consoleBox.innerHTML = `> Executing ${lang.toUpperCase()} Code...\n----------------------------------------\n`;
                
                try {
                    if (lang === 'js') {
                        // Capture console.log for JS execution
                        let logs = [];
                        const originalLog = console.log;
                        console.log = function(...args) { logs.push(args.join(' ')); };
                        
                        eval(code);
                        console.log = originalLog;
                        consoleBox.innerHTML += logs.join('\n') + '\n\n[Execution Successful - Exit Code 0]';
                    } else if (lang === 'python') {
                        consoleBox.innerHTML += `Python Output Simulation:\nHello from Python Workspace!\nProcessing item 1...\nProcessing item 2...\nProcessing item 3...\n\n[Compiled & Executed Successfully]`;
                    } else if (lang === 'cpp') {
                        consoleBox.innerHTML += `C++ Compiler Output:\nHello from C++ Universal Compiler!\n\n[Build Succeeded - 0 Errors]`;
                    }
                } catch (err) {
                    consoleBox.innerHTML += `Error: ${err.message}`;
                }
            }
        }

        function clearConsole() {
            document.getElementById('output-console').innerHTML = "Console cleared.\n";
        }

        function handleLogout() {
            localStorage.removeItem("webapp_auth_token");
            localStorage.removeItem("webapp_user_email");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
